# ============================================
# MiqStore — Docker Compose (Production)
# App + Nginx ONLY. Managed DB and Redis are used.
# ============================================

services:
  # ── Next.js App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miqstore-app
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - miqstore-network

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: miqstore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - miqstore-network

networks:
  miqstore-network:
    driver: bridge
